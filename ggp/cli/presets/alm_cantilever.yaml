# ALM Short Cantilever Benchmark
# Cantilever with Additive Layer Manufacturing (ALM) constraints.
# Uses layer-by-layer component parameterisation with 45° overhang angle restrictions.

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      nx: 60
      ny: 30

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: ALM
  num_components: 50
  num_layers: 10
  comp_per_layer: 5
  layer_height: 3.333   # = Ly/(nY-1) so layers span exactly 0 to Ly=30
  r_gp: 0.5

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0
  - name: overhang
    type: ineq
    bound: 0.0
    params:
      alpha_deg: 45.0

solver:
  algorithm: MMA
  max_iter: 300
  options:
    # Wide asymptotes matching the reference GGP-Matlab/mmasub.py (asyinit=0.5,
    # asydecr=0.7, clamp [0.01, 10], move=0.01). Tight asymptotes make the MMA
    # subproblem stiff and the structure fails to reach the load (C~206); the
    # reference wide asymptotes give a proper load-bearing truss (C~86).
    max_optimization_step: 0.01
    initial_asymptotes_distance: 0.5
    max_asymptote_distance: 10.0
    min_asymptote_distance: 0.01
    asymptotes_distance_amplification_coefficient: 1.2
    asymptotes_distance_reduction_coefficient: 0.7
    use_penalty_formulation: true
    ftol_rel: 1.0e-20
    ftol_abs: 1.0e-20
    xtol_rel: 1.0e-20
    xtol_abs: 1.0e-20

volfrac: 0.4
