# 3D Short Cantilever Benchmark
# Cantilever beam in 3D: fixed on the left face, point load at mid-right face.
# Uses the Free 3D GGP formulation (8 variables per component).

geometries:
  - type: fenics_box
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      Lz: 30.0
      nx: 30
      ny: 15
      nz: 15

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: 3D_Free
  num_components: 20
  r_gp: 0.5

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0

solver:
  algorithm: MMA
  max_iter: 150
  options:
    max_optimization_step: 0.05
    initial_asymptotes_distance: 0.05
    max_asymptote_distance: 0.5
    min_asymptote_distance: 0.001

volfrac: 0.3
