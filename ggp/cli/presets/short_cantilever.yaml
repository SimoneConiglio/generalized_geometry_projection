# Short Cantilever Benchmark
# GGP reference benchmark: square 60×60 domain, clamped left, point load at mid-right.
# Variable structure: 5 bar columns x 18 layers (ALM/MNA, matching paper reference).
# Square domain matches Matlab reference (nelx=nely=52 scaled to 60×60).

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 60.0
      nx: 60
      ny: 60

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: ALM
  num_components: 90    # np * nY = 5 * 18 (informational)
  num_layers: 18
  comp_per_layer: 5
  layer_height: 3.3333  # Ly / num_layers = 60 / 18
  r_gp: 0.5             # sampling window radius (R = sqrt(1)/2 in Matlab reference)
  Ngp: 1                # 1 Gauss point per direction (centroid evaluation, matching reference)

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0

solver:
  algorithm: MMA
  max_iter: 150
  options:
    max_optimization_step: 0.05
    initial_asymptotes_distance: 0.05
    max_asymptote_distance: 0.05
    min_asymptote_distance: 0.00001

volfrac: 0.4
