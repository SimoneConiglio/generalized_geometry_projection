# Short Cantilever with an aggregated von Mises STRESS constraint (adjoint via JAX).
# Unified aggregation-relaxation: relaxed element stress rho^q * (se_ref @ u_e),
# von Mises, aggregated with a lower-bound aggregation; constraint  agg - 1 <= 0.
# NB a point load gives a stress singularity at the loaded node, so this preset is a
# wiring/convergence demonstration; the L-bracket (l_bracket_stress) is the sharper
# stress benchmark (re-entrant corner concentration).

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      nx: 60
      ny: 30

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 18
  method: GP
  r_gp: 0.5
  Ngp: 2

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0
  - name: stress
    type: ineq
    bound: 0.0
    params:
      sigma_limit: 40.0     # von Mises limit (unit E, unit load)
      q: 0.5                # relaxation exponent (q < p removes the singularity)
      aggregation: pmean    # lower-bound aggregation (pmean | ks | pnorm)
      P: 8.0                # aggregation/relaxation sharpness

solver:
  algorithm: MMA
  max_iter: 320
  fem_solver: direct
  options:
    max_optimization_step: 0.01
    initial_asymptotes_distance: 0.01
    max_asymptote_distance: 0.01
    min_asymptote_distance: 0.0001
    asymptotes_distance_amplification_coefficient: 1.2
    asymptotes_distance_reduction_coefficient: 0.4
    ftol_rel: 1.0e-20
    ftol_abs: 1.0e-20
    xtol_rel: 1.0e-20
    xtol_abs: 1.0e-20

volfrac: 0.4
