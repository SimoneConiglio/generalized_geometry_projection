# Short Cantilever — rectangle primitives, grid-fill start, minimum length scale
# Same as short_cantilever_grid.yaml but with a minimum member thickness (3 elements),
# so members are born thick enough to threshold to a clean, connected 0/1 design.

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      nx: 60
      ny: 30

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 18
  method: rect
  init: grid
  grid_nx: 6
  grid_ny: 3
  min_thickness: 3.0      # min member size in BOTH L and h (mesh units) -> length scale
  r_gp: 0.5
  Ngp: 3                  # 3x3 = 9 Gauss points in the sampling window (anti-checkerboard)

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0

solver:
  algorithm: MMA
  max_iter: 500
  fem_solver: direct
  options:
    max_optimization_step: 0.01
    initial_asymptotes_distance: 0.01
    max_asymptote_distance: 0.01
    min_asymptote_distance: 0.0001
    asymptotes_distance_amplification_coefficient: 1.2
    asymptotes_distance_reduction_coefficient: 0.4
    ftol_rel: 1.0e-20
    ftol_abs: 1.0e-20
    xtol_rel: 1.0e-20
    xtol_abs: 1.0e-20

volfrac: 0.4
