# Short Cantilever Benchmark
# Standard GGP topology optimisation benchmark with a cantilever beam
# fixed on the left edge and a point load at the mid-right.

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      nx: 60
      ny: 30

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 18

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0

solver:
  algorithm: MMA
  max_iter: 50

volfrac: 0.4
