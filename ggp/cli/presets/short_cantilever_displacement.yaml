# Short Cantilever with a POINT-DISPLACEMENT constraint (adjoint-based).
# Bounds |u_y| at a tracked point to u_max. Uses the deterministic direct solver.
# NB: for a single point load, tip deflection == compliance, so to make the
# displacement constraint non-trivial the tracked point/axis can be moved via
# params.point / params.axis; here it demonstrates the wiring and adjoint gradient.

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      nx: 60
      ny: 30

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 18
  method: GP
  r_gp: 0.5
  Ngp: 2

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0
  - name: displacement
    type: ineq
    bound: 0.0
    params:
      axis: 1            # constrain the y-component
      u_max: 200.0       # bound on |u_y| at the tracked point
      # point: [60.0, 15.0]   # defaults to the loaded mid-right point

solver:
  algorithm: MMA
  max_iter: 320
  fem_solver: direct
  options:
    max_optimization_step: 0.01
    initial_asymptotes_distance: 0.01
    max_asymptote_distance: 0.01
    min_asymptote_distance: 0.0001
    asymptotes_distance_amplification_coefficient: 1.2
    asymptotes_distance_reduction_coefficient: 0.4
    ftol_rel: 1.0e-20
    ftol_abs: 1.0e-20
    xtol_rel: 1.0e-20
    xtol_abs: 1.0e-20

volfrac: 0.4
