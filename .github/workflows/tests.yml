name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: micromamba-shell {0}

    steps:
    - uses: actions/checkout@v4



    - name: Set up Micromamba Environment
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: environment.yml
        environment-name: ggp
        cache-environment: true
        cache-downloads: true

    - name: Run Pytest with Coverage
      env:
        PYTHONPATH: .
      run: |
        set -e
        pip install "setuptools<70"
        pytest --cov=ggp --cov-report=json tests/
        PERCENT=$(jq '.totals.percent_covered' coverage.json)
        COLOR=$(python3 -c "print('green' if $PERCENT > 80 else 'yellow' if $PERCENT > 50 else 'red')")
        mkdir -p badges
        echo "{\"schemaVersion\": 1, \"label\": \"coverage\", \"message\": \"${PERCENT%.*}%\", \"color\": \"$COLOR\"}" > badges/coverage.json

    - name: Deploy Coverage JSON
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: badges
        publish_branch: gh-pages
        destination_dir: badges
        keep_files: true
