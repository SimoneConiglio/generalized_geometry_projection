# MBB Beam Benchmark
# Half-symmetry Messerschmidt-Bölkow-Blohm beam.
# Left edge: x-symmetry (ux=0).  Bottom-right corner: vertical roller (uy=0).
# Top-left corner: point load downward.
# 18 free bars, AMNA (MNA) characteristic function, 2:1 domain.

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      nx: 60
      ny: 30

boundary_conditions:
  - region: left
    type: symmetry
    components: [0]
  - region: bottom_right_corner
    type: prescribed
    components: [1]
    value: [0.0]

loads:
  - region: top_left_corner
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 18
  method: AMNA
  r_gp: 1.0
  Ngp: 1

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0

solver:
  algorithm: MMA
  max_iter: 400
  options:
    max_optimization_step: 0.1
    initial_asymptotes_distance: 0.01
    max_asymptote_distance: 0.5
    asymptotes_distance_reduction_coefficient: 0.4

volfrac: 0.4
