# L-Shape Bracket — MASS MINIMIZATION under a von Mises stress constraint.
# The classical stress-constrained formulation (Le, Norato et al. 2010):
#     minimize   volume
#     subject to stress(x) <= sigma_limit
# There is NO volume constraint: material is removed until the stress bound becomes
# genuinely active, and the Le-Norato adaptive allowable drives the design so the TRUE
# max von Mises (over material elements, load region excluded) stops at sigma_limit --
# neither infeasible (raw lower-bound aggregation) nor over-conservative (fixed
# allowable held active by intermediate-density boundary artifacts).

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 60.0
      nx: 60
      ny: 60
  - type: box
    role: non_design
    params:
      origin: [30.0, 30.0]
      extent: [60.0, 60.0]

boundary_conditions:
  - region: top
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 36
  method: GP
  # Material-rich, stress-FEASIBLE start (Le et al. start from full material): a 6x6
  # grid of domain-filling bars at Mc = volfrac = 1. Mass-min under a Verbart stress
  # constraint from an infeasible/thin start collapses to the degenerate empty design
  # (a homogeneous Emin body has moderate, E-independent solid stress, so g_e -> 0);
  # from a feasible solid start the load path cannot be dismantled feasibly.
  init: grid
  grid_nx: 6
  grid_ny: 6
  r_gp: 0.5
  Ngp: 2

objective:
  name: volume
  sense: minimize
  params:
    shift: 200.0    # constant offset keeping the objective positive: gemseo-mma's
                    # relative-change stop test divides by the SIGNED initial objective,
                    # so a negative-starting response stops MMA at iteration 1. The
                    # shift changes no gradient/minimizer and is removed in reporting.

constraints:
  - name: stress
    type: ineq
    bound: 0.0
    params:
      sigma_limit: 0.8      # von Mises limit (unit E, unit load). NB on this 60x60 mesh
                            # a 1-element-wide member carrying the unit load runs at
                            # sigma_vm ~ 1.15, so the limit must sit BELOW that mesh cap
                            # for the stress constraint to genuinely size the members
                            # (sigma_lim above ~1.15 can never bind: mass-min then stops
                            # at the mesh's minimum feature, not at the stress limit).
      aggregation: verbart
      P: 8.0
      adaptive: true        # Le-Norato adaptive allowable -> stop at max sigma = limit
      alpha: 0.5
      rho_solid: 0.5
      exclude_radius: 0.0   # do NOT exclude the load region here: under mass
                            # minimization the load-adjacent stress is what anchors
                            # load-carrying (fading it makes rho*sigma_hat blow up);
                            # excluding it lets the design "hide" all stress inside the
                            # excluded ball and collapse to void. On this mesh the
                            # load-element stress of a good design (~1.3) is below
                            # sigma_limit, so no exclusion is needed.
      max_correction: 4.0   # one-sided: tightening bounded, relaxing free

solver:
  algorithm: MMA
  max_iter: 400
  fem_solver: direct
  options:
    max_optimization_step: 0.01
    initial_asymptotes_distance: 0.01
    max_asymptote_distance: 0.01
    min_asymptote_distance: 0.0001
    asymptotes_distance_amplification_coefficient: 1.2
    asymptotes_distance_reduction_coefficient: 0.4
    ftol_rel: 1.0e-20
    ftol_abs: 1.0e-20
    xtol_rel: 1.0e-20
    xtol_abs: 1.0e-20

# Reference volume fraction: normalizes the 'volume' response, and sets the grid
# init's Mc -> 1.0 = solid, stress-feasible starting material.
volfrac: 1.0
