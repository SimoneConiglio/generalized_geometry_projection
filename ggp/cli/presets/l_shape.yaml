# L-Shape Bracket Benchmark
# Square domain with top edge fixed and a point load on the mid-right edge.
# Upper-right quadrant is voided (non-design / empty elements).
# 18 free bars, GP characteristic function.
# Parameters match the Matlab GGP_main.m reference implementation.

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 60.0
      nx: 60
      ny: 60
  - type: box
    role: non_design
    params:
      origin: [30.0, 30.0]
      extent: [60.0, 60.0]

boundary_conditions:
  - region: top
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 18
  method: GP
  r_gp: 0.5
  Ngp: 2

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0

solver:
  algorithm: MMA
  max_iter: 600
  options:
    max_optimization_step: 0.01
    initial_asymptotes_distance: 0.01
    max_asymptote_distance: 0.01
    min_asymptote_distance: 0.0001
    asymptotes_distance_amplification_coefficient: 1.2
    asymptotes_distance_reduction_coefficient: 0.4
    use_penalty_formulation: false
    ftol_rel: 1.0e-20
    ftol_abs: 1.0e-20
    xtol_rel: 1.0e-20
    xtol_abs: 1.0e-20

volfrac: 0.4

# Initial guess: seed components from a coarse quad lattice (each quad -> 4 triangles via its centre);
# one bar per skeleton edge, cell_size drives the component count.
init:
  pattern: quad_star
  cell_size: 20
