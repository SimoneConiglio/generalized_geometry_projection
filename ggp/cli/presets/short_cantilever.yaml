# Short Cantilever Benchmark
# Standard GGP topology optimisation benchmark with a cantilever beam
# fixed on the left edge and a point load at the mid-right.
# 18 free bars, GP characteristic function, 2:1 domain.
# Parameters match the Matlab GGP_main.m reference implementation.

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      nx: 60
      ny: 30

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 18
  method: GP
  r_gp: 0.5
  Ngp: 2

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0

solver:
  algorithm: MMA
  max_iter: 320
  options:
    # Exact GGP-Matlab/mmasub.m settings (the authoritative MATLAB reference, which
    # converges to the symmetric single-X truss at C~75, iter ~284):
    #   asyinit=0.01, asyincr=1.2, asydecr=0.4, move=0.01, clamp [0.0001, 0.01],
    #   classical MMA (d=0), subsolv inner cap 500.
    # The tight asymptotes make the MMA subproblem stiff: gemseo-mma's primal-dual
    # Newton needs up to ~1152 inner iterations to converge, far above its default
    # cap of 200 (which under-solves the subproblem and breaks symmetry). We raise
    # max_inner_iterations to 2000 so the subproblem is solved fully each step.
    max_optimization_step: 0.01
    initial_asymptotes_distance: 0.01
    max_asymptote_distance: 0.01
    min_asymptote_distance: 0.0001
    asymptotes_distance_amplification_coefficient: 1.2
    asymptotes_distance_reduction_coefficient: 0.4
    use_penalty_formulation: false
    max_inner_iterations: 2000
    ftol_rel: 1.0e-20
    ftol_abs: 1.0e-20
    xtol_rel: 1.0e-20
    xtol_abs: 1.0e-20

volfrac: 0.4
