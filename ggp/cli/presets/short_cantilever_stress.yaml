# Short Cantilever with an aggregated von Mises STRESS constraint (adjoint via JAX).
# Canonical UNIFIED AGGREGATION-RELAXATION (Verbart, Langelaar & van Keulen 2017 --
# the formulation adopted in the Coniglio thesis's Eulerian chapter):
#   g_e = rho_e * (vm(se_ref @ u_e)/sigma_lim - 1)      (solid-material stress)
#   G   = (1/P) ln( mean_e exp(P g_e) ) <= 0            (lower-bound KS)
# One parameter P controls both aggregation sharpness and relaxation.
# NB a point load gives a stress singularity at the loaded node, so this preset is a
# wiring/convergence demonstration; the L-bracket (re-entrant corner) is the sharper
# stress benchmark.

geometries:
  - type: fenics_rectangle
    role: design
    params:
      Lx: 60.0
      Ly: 30.0
      nx: 60
      ny: 30

boundary_conditions:
  - region: left
    type: fixed

loads:
  - region: mid_right
    type: point
    value: [0.0, -1.0]

formulation:
  mode: Free
  num_components: 18
  method: GP
  r_gp: 0.5
  Ngp: 2

objective:
  name: compliance

constraints:
  - name: volume
    type: ineq
    bound: 0.0
  - name: stress
    type: ineq
    bound: 0.0
    params:
      sigma_limit: 40.0     # von Mises limit (unit E, unit load)
      aggregation: verbart  # unified aggregation-relaxation (also: pmean | ks | pnorm + q)
      P: 8.0                # single aggregation/relaxation parameter

solver:
  algorithm: MMA
  max_iter: 320
  fem_solver: direct
  options:
    max_optimization_step: 0.01
    initial_asymptotes_distance: 0.01
    max_asymptote_distance: 0.01
    min_asymptote_distance: 0.0001
    asymptotes_distance_amplification_coefficient: 1.2
    asymptotes_distance_reduction_coefficient: 0.4
    ftol_rel: 1.0e-20
    ftol_abs: 1.0e-20
    xtol_rel: 1.0e-20
    xtol_abs: 1.0e-20

volfrac: 0.4
